name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    env:
      # verify_all.py skips COM/com0com benches when GITHUB_ACTIONS is set (no COM1 on runners).
      GITHUB_ACTIONS: true
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: verify_all (compile, unit tests, GUI smoke — no COM hardware)
        run: python verify_all.py
      - name: unittest
        run: python -m unittest discover -s tests -p "test_*.py"
